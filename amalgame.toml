
[package]
name = "amalgame-net-socketio"
version = "0.1.0"
license = "Apache-2.0"
description = "Server-side Socket.IO (Engine.IO v4 / Socket.IO v5) over amalgame-net-http WebSockets. v0.1: WebSocket-only, server->client broadcast (io.Emit) + connect/disconnect tracking. Pure-AM."
required-amalgame = ">=0.8.39"
schema-version = 1

[dependencies]
amalgame-net-http = ">=0.18.0"
amalgame-threading = ">=0.1.0"

[dependencies.async]
git = "github.com/amalgame-lang/amalgame-async"
tag = "v0.3.0"

[dependencies.crypto]
git = "github.com/amalgame-lang/amalgame-crypto"
tag = "v0.7.0"

[dependencies.tls]
git = "github.com/amalgame-lang/amalgame-tls"
tag = "v0.3.3"

[dependencies.http]
git = "github.com/amalgame-lang/amalgame-net-http"
tag = "v0.24.0"

[dependencies.threading]
git = "github.com/amalgame-lang/amalgame-threading"
tag = "v0.1.0"

[stdlib]
classes = ["SocketIO", "SioProtocol"]
namespace = "Amalgame.Net.SocketIO"
facade = "socketio.am"
sources = ["socketio.am"]
